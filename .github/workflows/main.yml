name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: xcrun swift-format lint --strict --recursive --parallel NextSunnyDay NextSunnyDayWidget NextSunnyDayTests Packages

      - name: Cache Swift Package Manager packages
        uses: actions/cache@v6
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Pushes to main only check that the app builds (no simulator boot).
      # Tests run locally before pushing, and on PRs and manual runs.
      - name: Build
        if: github.event_name == 'push'
        run: >
          set -o pipefail &&
          xcodebuild
          -scheme NextSunnyDay
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath SourcePackages
          build

      - name: Build and Test
        if: github.event_name != 'push'
        run: >
          set -o pipefail &&
          xcodebuild
          -scheme NextSunnyDay
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.4.1'
          -clonedSourcePackagesDirPath SourcePackages
          -resultBundlePath TestResults.xcresult
          -only-testing:NextSunnyDayTests
          test

      - uses: actions/upload-artifact@v7
        if: failure() && github.event_name != 'push'
        with:
          name: test-results
          path: TestResults.xcresult
