name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# To move to another Xcode, change these together with the Xcode used locally:
# DEVELOPER_DIR is the Xcode on the runner image, SIMULATOR_OS the iOS
# simulator that comes with it (`xcrun simctl list runtimes`).
env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app
  SIMULATOR_OS: "26.4.1"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: xcrun swift-format lint --strict --recursive --parallel NextSunnyDay NextSunnyDayWidget NextSunnyDayTests Packages Tools

      - name: Check imports
        run: swift run --package-path Tools/ImportCheck import-check .

      # Pushes to main only check that the app builds (no simulator).
      # Tests run locally before pushing, and on PRs and manual runs.
      - name: Build
        if: github.event_name == 'push'
        run: >
          set -o pipefail &&
          xcodebuild
          -scheme NextSunnyDay
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          build

      - name: Test the packages
        if: github.event_name != 'push'
        run: |
          swift test --package-path Tools/ImportCheck
          for package in Packages/Core/* Packages/Features/*; do
            swift test --package-path "$package"
          done

      # The simulator boots on the first test run, which takes about six
      # minutes on a fresh runner; booting it ahead of the build doesn't save
      # time, because the boot slows down the steps that run alongside it.
      - name: Test the app
        if: github.event_name != 'push'
        run: >
          set -o pipefail &&
          xcodebuild
          -scheme NextSunnyDay
          -configuration Debug
          -destination "platform=iOS Simulator,name=iPhone 17,OS=$SIMULATOR_OS"
          -resultBundlePath TestResults.xcresult
          -only-testing:NextSunnyDayTests
          test

      - uses: actions/upload-artifact@v7
        if: failure() && github.event_name != 'push'
        with:
          name: test-results
          path: TestResults.xcresult
