name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift Package Manager packages
        uses: actions/cache@v6
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Inject Access Token
        run: echo "let openWeatherAPIKey = \"${{ secrets.OPEN_WEATHER_API_KEY }}\"" > ./NextSunnyDay/API/AccessTokens.swift

      - name: Build and Test
        run: >
          set -o pipefail &&
          xcodebuild
          -scheme NextSunnyDay
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.4.1'
          -clonedSourcePackagesDirPath SourcePackages
          -resultBundlePath TestResults.xcresult
          -only-testing:NextSunnyDayTests
          test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: TestResults.xcresult
