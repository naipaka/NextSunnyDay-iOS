name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  # PRs always run, so that the required test jobs report a result: a PR that
  # changes only Markdown or docs/ skips them in the `changes` job instead.
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# To move to another Xcode, change these together with the Xcode used locally:
# DEVELOPER_DIR is the Xcode on the runner image, SIMULATOR_OS the iOS
# simulator that comes with it (`xcrun simctl list runtimes`).
# Xcode 27.1 is only on the `xcode-27` preview image, whose only iOS
# simulators are iOS 27.0 (iOS 27.1 adds just the iPhone Duo).
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app
  SIMULATOR_OS: "27.0"

jobs:
  # Pushes to main (the merges of tested PRs) only check that the app builds.
  build:
    name: Lint and build
    if: github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: xcrun swift-format lint --strict --recursive --parallel NextSunnyDay NextSunnyDayWidget NextSunnyDayWatch NextSunnyDayWatchWidget NextSunnyDayTests Packages Tools

      - name: Check imports
        run: swift run --package-path Tools/ImportCheck import-check .

      - name: Build
        run: >
          set -o pipefail &&
          xcodebuild
          -scheme NextSunnyDay
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          build

  # Whether a PR changes anything but Markdown and docs/. A test job skipped
  # by its condition counts as passed for the required checks.
  changes:
    name: Changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A PR checks out its merge commit, whose first parent is the base.
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # PRs and manual runs test in two jobs side by side: the app's tests spend
  # most of their time waiting for the simulator to boot on a fresh runner,
  # long enough to lint and test every package on another runner meanwhile.
  test-packages:
    name: Lint and test the packages
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: xcrun swift-format lint --strict --recursive --parallel NextSunnyDay NextSunnyDayWidget NextSunnyDayWatch NextSunnyDayWatchWidget NextSunnyDayTests Packages Tools

      - name: Check imports
        run: swift run --package-path Tools/ImportCheck import-check .

      - name: Test the packages
        run: |
          swift test --package-path Tools/ImportCheck
          for package in Packages/Core/* Packages/Features/*; do
            swift test --package-path "$package"
          done

  test-app:
    name: Test the app
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # The simulator boots on the first test run, which takes minutes on a
      # fresh runner; booting it ahead of the build doesn't save time, because
      # the boot slows down the steps that run alongside it.
      - name: Test the app
        run: >
          set -o pipefail &&
          xcodebuild
          -scheme NextSunnyDay
          -configuration Debug
          -destination "platform=iOS Simulator,name=iPhone 17,OS=$SIMULATOR_OS"
          -resultBundlePath TestResults.xcresult
          -only-testing:NextSunnyDayTests
          test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: TestResults.xcresult
